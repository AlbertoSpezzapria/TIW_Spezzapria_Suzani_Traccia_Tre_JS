<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <script src="utils.js" charset="utf-8" defer></script>
	<script src="loginManagement.js" charset="utf-8" defer></script>
	<link rel="stylesheet" type="text/css" media="all" href="CSS/style.css" />
</head>
<body>
    <div class="container">
        <h2>Benvenuto nell'applicazione WEB per verbalizzazione dei voti</h2>
        <form action="#" class="form">
            <fieldset>
                <legend>Login</legend>

                <label for="username">Utente</label>
                <input class="input" type="text" id="username" name="username" placeholder="Username" required>

                <label for="pwd">Password</label>
                <input class="input" type="password" id="pwd" name="pwd" placeholder="Password" required>

                <button id="loginbutton" type="submit" class="btn-submit">Login</button>
                <p id="errormessage"></p>
            </fieldset>
        </form>
    </div>
</body>
</html>
