<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Verbali</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="container">

        <div class="top-bar">
            <h2 class="heading-lg">Lista dei Verbali</h2>
            <a th:href="@{/Logout}">
                <button class="btn btn-logout">Logout</button>
            </a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Nome Corso</th>
                    <th>Data Esame</th>
                    <th>Creazione Verbale</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="report : ${reports}">
                    <td th:text="${report.courseName}">Nome Corso</td>
                    <td th:text="${#dates.format(report.examinationDate, 'dd/MM/yyyy')}">Data Esame</td>
                    <td th:text="${#dates.format(report.timestamp, 'dd/MM/yyyy HH:mm')}">Creazione</td>
                    <td>
                        <a th:href="@{'/GetReport?id=' + ${report.idReport}}">
                            <button class="btn btn-small">Vai al report</button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
</html>
