<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Lista Appelli</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="container">
		<div class="top-bar">
			<h2 th:text="${course.name}">Nome Corso</h2>
	<div align="right">
		<a href="login.html" th:href="@{/Logout}"><button>Logout</button></a>
	</div>
		</div>

		<h3>Appelli disponibili</h3>

		<div th:if="${not #lists.isEmpty(examinations)}">
			<p>Seleziona un'appello per maggiori dettagli:</p>
			<table class="table">
				<thead>
					<tr>
						<th>Data</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="examination : ${examinations}">
						<td th:text="${examination.date}">Data Appello</td>
						<td>
							<a th:href="${session.user.role == 'professor'} ? 
							@{/GetEnrolledStudent(id=${examination.idExam})} : 
							@{/GetGrade(id=${examination.idExam})}">
								<button class="btn btn-small">Visualizza Dettagli</button>
							</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div th:if="${#lists.isEmpty(examinations)}">
			<p>Non ci sono appelli disponibili per il corso selezionato</p>
		</div>
	</div>
</body>
</html>
